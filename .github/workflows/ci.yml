name: Estate service
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: chmod +x mvnw
      - run: ./mvnw --batch-mode --no-transfer-progress verify -Pintegration
      - run: python -m pip install -r requirements-test.txt
      - run: python scripts/validate_events.py
      - run: python scripts/validate_api.py
      - run: docker build -t agrosphere-estate-service:ci .
